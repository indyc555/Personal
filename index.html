<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;
}
h1{
  font-size:1.8rem;font-weight:900;letter-spacing:2px;text-align:center;
  background:linear-gradient(90deg,#D4AF37,#ffd700,#D4AF37);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
p.sub{color:rgba(255,255,255,.45);text-align:center;font-size:.88rem;margin-bottom:36px;letter-spacing:1px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:700px}
.app-card{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:28px 24px;text-decoration:none;color:inherit;
  display:flex;align-items:center;gap:18px;
  transition:transform .2s,background .2s;
}
.app-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.12)}
.app-icon{
  width:58px;height:58px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;flex-shrink:0;
}
.app-body .app-name{font-size:1.05rem;font-weight:800;color:#fff;margin-bottom:4px}
.app-body .app-desc{font-size:.8rem;color:rgba(255,255,255,.5);line-height:1.4}
footer{margin-top:40px;color:rgba(255,255,255,.2);font-size:.75rem}
</style>
</head>
<body>
<h1>My Apps</h1>
<p class="sub">indyc555</p>
<div class="apps">
  <a class="app-card" href="./hindi-app/">
    <div class="app-icon" style="background:linear-gradient(135deg,#c0392b,#922b21)">🎬</div>
    <div class="app-body">
      <div class="app-name">Seekho Hindi Aap</div>
      <div class="app-desc">Learn Hindi through Bollywood films, songs & quizzes</div>
    </div>
  </a>
  <a class="app-card" href="./qbr-planner/">
    <div class="app-icon" style="background:linear-gradient(135deg,#1a6b3c,#0f3d22)">🏔️</div>
    <div class="app-body">
      <div class="app-name">QBR Planner</div>
      <div class="app-desc">Quarterly Bros Reunion — schedule, members & activities</div>
    </div>
  </a>
</div>
<footer>indyc555.github.io/Personal</footer>
</body>
</html>
