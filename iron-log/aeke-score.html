<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEKE Score | Iron Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --border: #2a2a4a;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: var(--border); color: var(--text); }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .header-title span { color: var(--accent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .upload-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 32px;
    }

    .upload-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="date"],
    .form-group input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
      min-width: 180px;
    }

    .form-group input[type="date"]:focus,
    .form-group input[type="text"]:focus {
      border-color: var(--accent);
    }

    .form-group input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.5);
      cursor: pointer;
    }

    .drop-zone {
      flex: 1;
      min-width: 220px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(233, 69, 96, 0.05);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone-text {
      color: var(--text-muted);
      font-size: 14px;
    }

    .drop-zone-text strong { color: var(--accent); }

    .preview-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: block;
      margin: 0 auto 8px;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
      align-self: flex-end;
      height: 42px;
    }

    .btn-add:hover { opacity: 0.85; }
    .btn-add:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Sort controls */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .sort-bar label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sort-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .sort-btn.active {
      background: var(--accent2);
      border-color: var(--accent);
      color: var(--text);
    }

    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .photo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
    }

    .photo-card-body {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .photo-date {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .photo-note {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 5px 9px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(233, 69, 96, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 16px; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e2d40;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="./" class="back-btn">
      ← Iron Log
    </a>
    <h1 class="header-title">AEKE <span>Score</span></h1>
  </div>
</header>

<main>
  <div class="upload-card">
    <h2>Add Progress Photo</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="entry-date" />
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="entry-note" placeholder="e.g. Week 4 check-in" maxlength="80" />
      </div>
      <div class="form-group" style="flex:1; min-width:200px;">
        <label>Photo</label>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/*" />
          <img class="preview-thumb" id="preview-thumb" style="display:none;" alt="preview" />
          <p class="drop-zone-text" id="drop-text"><strong>Click or drag</strong> to select image</p>
        </div>
      </div>
      <button class="btn-add" id="btn-add" disabled>Add Entry</button>
    </div>
  </div>

  <div class="sort-bar">
    <label>Sort:</label>
    <button class="sort-btn active" data-order="desc" id="sort-desc">Newest First</button>
    <button class="sort-btn" data-order="asc" id="sort-asc">Oldest First</button>
  </div>

  <div class="photo-grid" id="photo-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="icon">📸</div>
    <p>No progress photos yet. Add your first entry above.</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const DB_NAME = 'aeke-score-db';
  const STORE = 'entries';
  let db;
  let sortOrder = 'desc';
  let pendingFile = null;

  // --- IndexedDB ---
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  function addEntry(entry) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(entry);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  function getAllEntries() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  function deleteEntry(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = e => reject(e.target.error);
    });
  }

  // --- UI ---
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
  }

  function renderGrid(entries) {
    const grid = document.getElementById('photo-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';

    const sorted = [...entries].sort((a, b) => {
      if (sortOrder === 'asc') return a.date.localeCompare(b.date);
      return b.date.localeCompare(a.date);
    });

    if (sorted.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    sorted.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const img = document.createElement('img');
      img.src = entry.imageData;
      img.alt = entry.note || formatDate(entry.date);
      img.loading = 'lazy';

      const body = document.createElement('div');
      body.className = 'photo-card-body';

      const info = document.createElement('div');
      const dateEl = document.createElement('div');
      dateEl.className = 'photo-date';
      dateEl.textContent = formatDate(entry.date);
      info.appendChild(dateEl);

      if (entry.note) {
        const noteEl = document.createElement('div');
        noteEl.className = 'photo-note';
        noteEl.textContent = entry.note;
        info.appendChild(noteEl);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', async () => {
        if (confirm('Delete this entry?')) {
          await deleteEntry(entry.id);
          loadAndRender();
        }
      });

      body.appendChild(info);
      body.appendChild(delBtn);
      card.appendChild(img);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  async function loadAndRender() {
    const entries = await getAllEntries();
    renderGrid(entries);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // --- File input ---
  const fileInput = document.getElementById('file-input');
  const previewThumb = document.getElementById('preview-thumb');
  const dropText = document.getElementById('drop-text');
  const dropZone = document.getElementById('drop-zone');
  const btnAdd = document.getElementById('btn-add');

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    pendingFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewThumb.src = e.target.result;
      previewThumb.style.display = 'block';
      dropText.style.display = 'none';
    };
    reader.readAsDataURL(file);
    updateAddBtn();
  }

  fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });

  const entryDate = document.getElementById('entry-date');
  entryDate.addEventListener('change', updateAddBtn);

  function updateAddBtn() {
    btnAdd.disabled = !(pendingFile && entryDate.value);
  }

  // Set today as default date
  const today = new Date().toISOString().slice(0, 10);
  entryDate.value = today;

  btnAdd.addEventListener('click', async () => {
    if (!pendingFile || !entryDate.value) return;
    btnAdd.disabled = true;
    btnAdd.textContent = 'Saving…';

    const reader = new FileReader();
    reader.onload = async e => {
      const entry = {
        date: entryDate.value,
        note: document.getElementById('entry-note').value.trim(),
        imageData: e.target.result,
        addedAt: Date.now(),
      };
      await addEntry(entry);
      await loadAndRender();

      // reset form
      pendingFile = null;
      fileInput.value = '';
      previewThumb.style.display = 'none';
      dropText.style.display = 'block';
      document.getElementById('entry-note').value = '';
      entryDate.value = today;
      btnAdd.textContent = 'Add Entry';
      updateAddBtn();
      showToast('Entry added!');
    };
    reader.readAsDataURL(pendingFile);
  });

  // --- Sort ---
  document.getElementById('sort-desc').addEventListener('click', () => {
    sortOrder = 'desc';
    document.getElementById('sort-desc').classList.add('active');
    document.getElementById('sort-asc').classList.remove('active');
    loadAndRender();
  });

  document.getElementById('sort-asc').addEventListener('click', () => {
    sortOrder = 'asc';
    document.getElementById('sort-asc').classList.add('active');
    document.getElementById('sort-desc').classList.remove('active');
    loadAndRender();
  });

  // --- Init ---
  openDB().then(d => {
    db = d;
    loadAndRender();
  });
</script>
</body>
</html>
